<body>
    <div class="container">
        <!-- Login Section -->
        <div id="login-section">
            <img src="Expense_Vibes_Icon.png" alt="Expense Icon" class="expense-icon">
            <h1>Expense Vibes</h1>
            <p class="subtitle">Record your spending now!</p>
            <input type="text" id="name" placeholder="Enter your name" class="short-input" maxlength="20"/>
            <br>
            <button onclick="login()">Continue</button>
            <div class="login-footer" style="text-align:center; color:#888; font-size:0.98em; margin-top:36px;">
                © 2025 Silvia Wu. All rights reserved.
            </div>
        </div>

        <!-- User Greeting at the top -->
        <h2 id="user-greeting" style="display:none;"></h2>

        <!-- Budget Tracker Section (hidden by default) -->
        <div id="budget-section" style="display:none; margin-top:30px;">
            <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 10px;">
                <h2 style="margin: 0;">Receipt</h2>
                <img src="Expense_Vibes_Icon.png" alt="Receipt Icon" style="width:40px; height:40px;">
            </div>
            <!-- Date input moved here -->
            <div style="display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 8px;">
                <label for="expense-date" style="font-size:0.98em; color:#555; margin-bottom:0;">Date (mm/dd/yy):</label>
                <input type="date" id="expense-date" style="min-width:120px; width:100%;" />
            </div>
            <input type="number" id="budget" placeholder="Total budgets" />
            <input type="text" id="expense-name" placeholder="Expense Description" />
            <input type="number" id="expense-amount" placeholder="Expense Amount" />
            <button onclick="addExpense()">Add Expense</button>

            <p>Total spent: $<span id="total-budget">0</span></p>
            <p>Remaining expenses: $<span id="remaining">0</span></p>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>No.</th>
                            <th>Date</th>
                            <th>Expense Description</th>
                            <th>Expense Amount</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="expense-table"></tbody>
                </table>
            </div>
            <div class="button-row space-between">
                <button onclick="downloadReceipt()">Download</button>
                <button onclick="resetExpenses()">Reset</button>
                <button onclick="returnToLogin()">Home</button>
            </div>
        </div>

        <!-- Social Media Section (visible after login) -->
        <div id="report-section" style="display:none; text-align:center;">
            <a href="#" onclick="openKofiModal(); return false;" class="donate-btn improved-donate-btn" style="margin-left:10px; display:inline-flex; align-items:center; gap:8px; margin-bottom:10px;">
                <img src="https://storage.ko-fi.com/cdn/brandasset/v2/kofi_symbol.png" alt="Ko-fi" style="height:22px; width:22px; vertical-align:middle;">
                Support Me 
            </a>
            <p style="font-weight:bold; color:#2563eb; margin-bottom:6px; font-size:1.1em; letter-spacing:0.5px; text-align:center; margin-left:28px;">Smart Spending, Shared. Join Us!</p>
            <div style="margin-bottom: 10px;">
                <!-- Facebook Share -->
                <a href="https://www.facebook.com/sharer/sharer.php?u=https://silvia-9.github.io/expense_vibes/" 
                   target="_blank" class="social-icon" title="Facebook">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/facebook.svg" alt="Facebook" width="36" height="36" />
                </a>
                <!-- Telegram Share -->
                <a href="https://t.me/share/url?url=https://silvia-9.github.io/expense_vibes/&text=Check%20out%20Expense%20Vibes%20for%20easy%20budget%20tracking!" 
                   target="_blank" class="social-icon" title="Telegram">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/telegram.svg" alt="Telegram" width="36" height="36" />
                </a>
                <!-- Instagram (profile link, as Instagram does not support direct web sharing) -->
                <a href="https://instagram.com/" target="_blank" class="social-icon" title="Instagram">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" width="36" height="36" />
                </a>
                <!-- WhatsApp Share -->
                <a href="https://wa.me/?text=Check%20out%20Expense%20Vibes%20for%20easy%20budget%20tracking!%20https://silvia-9.github.io/expense_vibes/" 
                   target="_blank" class="social-icon" title="WhatsApp">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/whatsapp.svg" alt="WhatsApp" width="36" height="36" />
                </a>
                <!-- LINE Share -->
                <a href="https://social-plugins.line.me/lineit/share?url=https://silvia-9.github.io/expense_vibes/" 
                   target="_blank" class="social-icon" title="LINE">
                    <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/line.svg" alt="LINE" width="36" height="36" />
                </a>
            </div>
            <div class="footer-vibes">
                © 2025 Silvia Wu. All rights reserved.
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <!-- Ko-fi Modal -->
    <div id="kofi-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.55); z-index:9999; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:12px; max-width:420px; width:96vw; margin:auto; position:relative; box-shadow:0 8px 32px rgba(0,0,0,0.18);">
            <button onclick="document.getElementById('kofi-modal').style.display='none'" style="position:absolute;top:8px;right:12px;font-size:1.5em;background:none;border:none;cursor:pointer;">×</button>
            <iframe id="kofiframe" src="https://ko-fi.com/silviawu/?hidefeed=true&widget=true&embed=true&preview=true" style="border:none;width:100%;padding:4px;background:#f9f9f9;" height="712" title="silviawu"></iframe>
        </div>
    </div>
</body>
</html>
